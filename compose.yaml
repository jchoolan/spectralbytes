name: spectralbytes-new

services:
  ctfd:
    image: spectralbytes-ctfd:postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://ctfd:${CTFD_DB_PASSWORD}@db:5432/ctfd
      REDIS_URL: redis://cache:6379
      SECRET_KEY: ${CTFD_SECRET_KEY}
      WORKERS: "1"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    volumes:
      - ctfd_uploads:/var/uploads
      - ctfd_logs:/var/log/CTFd
    networks:
      - control

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctfd
      POSTGRES_USER: ctfd
      POSTGRES_PASSWORD: ${CTFD_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfd -d ctfd"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - control

  cache:
    image: redis:7.2-alpine
    restart: unless-stopped
    networks:
      - control

  s04:
    image: spectralbytes-new-s04:latest
    container_name: spectralbytes-new-s04
    restart: unless-stopped
    ports:
      - "127.0.0.1:2234:22"
    networks:
      - challenge_s04
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  s05:
    image: spectralbytes-new-s05:latest
    container_name: spectralbytes-new-s05
    restart: unless-stopped
    ports:
      - "127.0.0.1:8055:5000"
    networks:
      - challenge_s05
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128

networks:
  control:
    driver: bridge

  challenge_s04:
    driver: bridge
    internal: false

  challenge_s05:
    driver: bridge

volumes:
  ctfd_uploads:
  ctfd_logs:
  postgres_data:
